<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gopher GIS AR</title>
  <!-- Version pinned on purpose: bump only after re-testing on an iPhone and an Android phone. -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; background: #fff; }
    model-viewer { flex: 1; width: 100%; min-height: 0; background: #f2f2f2; }
    #ar-button {
      position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
      padding: 12px 24px; border: 0; border-radius: 24px;
      background: #7a0019; color: #fff; font-size: 16px;
    }
    footer { padding: 8px 12px; font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <!-- Sample model for now. When we have our own GLB, change src and the credit line below
       (our models need "© OpenStreetMap contributors"). -->
  <model-viewer src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
                alt="Sample 3D model of an astronaut"
                ar ar-modes="webxr scene-viewer quick-look"
                camera-controls shadow-intensity="1">
    <button slot="ar-button" id="ar-button">View in AR</button>
  </model-viewer>
  <footer>
    On a phone, tap "View in AR" to place the model on a table.
    Sample model: Astronaut by Poly by Google,
    <a href="https://creativecommons.org/licenses/by/2.0/">CC-BY 2.0</a>.
  </footer>
</body>
</html>
